services:
  # 1. Redpanda 
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: redpanda
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr 0.0.0.0:8082
      - --advertise-pandaproxy-addr localhost:8082
      - --rpc-addr 0.0.0.0:33145
      - --advertise-rpc-addr redpanda:33145
    ports:
      - "19092:19092"
      - "8082:8082"
  
  # Redpanda Console
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: redpanda-console
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: "redpanda:9092"
    depends_on:
      - redpanda

  # 2. Apache NiFi
  nifi:
    image: apache/nifi:2.0.0
    container_name: apache-nifi
    environment:
      - NIFI_WEB_HTTP_PORT=8081
    ports:
      - "8085:8081"
    depends_on:
      - redpanda

  # 3. PostGIS Spatial Database
  spatial-db:
    image: postgis/postgis:17-3.5
    container_name: spatial-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: maritime_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 4. MinIO (S3-Compatible Local Data Lakehouse Storage)
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"       # S3 API endpoint port
      - "9001:9001"       # Interactive Web UI console port
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata: